<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 970" role="img" aria-labelledby="title desc">
  <title id="title">REVIT MCP Study Issue 到 PR 的高訊號協作脈絡</title>
  <desc id="desc">根據 Issue 99、100、110、111 及 PR 115、124，呈現人工證據如何變成 SOP、實作與驗證，以及能力邊界如何沉澱為替代路徑。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px "Segoe UI","Microsoft JhengHei",sans-serif;fill:#172033}.sub{font:400 15px "Segoe UI","Microsoft JhengHei",sans-serif;fill:#526075}.h{font:700 15px "Segoe UI","Microsoft JhengHei",sans-serif;fill:#334155;letter-spacing:1px}.label{font:700 17px "Segoe UI","Microsoft JhengHei",sans-serif;fill:#1e293b}.txt{font:400 14px "Segoe UI","Microsoft JhengHei",sans-serif;fill:#475569}.small{font:400 12px "Segoe UI","Microsoft JhengHei",sans-serif;fill:#64748b}.box{stroke-width:2;rx:12}.e{fill:#eef6ff;stroke:#2563eb}.s{fill:#fff7e8;stroke:#d97706}.r{fill:#f4efff;stroke:#7c3aed}.p{fill:#ecfdf5;stroke:#059669}.v{fill:#effcfb;stroke:#0f766e}.n{fill:#fff1f2;stroke:#e11d48}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}.dash{fill:none;stroke:#d97706;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#ao)}.red{fill:none;stroke:#e11d48;stroke-width:2;marker-end:url(#ar)}.teal{fill:none;stroke:#0f766e;stroke-width:2;marker-end:url(#at)}.tag{font:700 12px "Segoe UI","Microsoft JhengHei",sans-serif;fill:#475569}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e11d48"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
  </defs>
  <rect class="bg" width="1540" height="970"/><text class="title" x="55" y="58">Issue → SOP → PR：從真實互動抽出的協作流程</text><text class="sub" x="55" y="85">樣本：#99/#100/#110/#111、#112/#113、PR #115/#124。實線＝已採用流程；虛線＝提案或尚未完成的實作。</text>
  <text class="h" x="55" y="130">1  提出者帶入可追溯情境</text><rect class="box e" x="55" y="150" width="300" height="150"/><text class="label" x="80" y="184">人工工作流與失敗證據</text><text class="txt" x="80" y="215">既有外掛、模型、截圖、Issue、程式</text><text class="txt" x="80" y="242">明確區分：人用流程 ≠ MCP 已完成</text><text class="small" x="80" y="274">#99 候選掃描；#100 預覽偏移；#111 handler 缺失</text>
  <rect class="box e" x="55" y="322" width="300" height="122"/><text class="label" x="80" y="356">可反駁的主張</text><text class="txt" x="80" y="386">來源、identity、版本、範圍、失敗情境</text><text class="small" x="80" y="417">不以「API success」或截圖取代讀回</text>
  <path class="edge" d="M355 225 C395 225,395 258,435 258"/><path class="edge" d="M355 383 C400 383,400 318,435 318"/>
  <text class="h" x="435" y="130">2  維護者將需求轉成審閱問題</text><rect class="box s" x="435" y="150" width="330" height="205"/><text class="label" x="460" y="184">把案例整理成流程</text><text class="txt" x="460" y="215">• 沿用既有作法或確認真正缺口</text><text class="txt" x="460" y="243">• 定義第一版不做什麼、資料如何對上、誰決定</text><text class="txt" x="460" y="271">• 列出少量待補事項與維護者決策</text><text class="txt" x="460" y="299">• 先建立可讀的流程說明</text><text class="small" x="460" y="331">#99/#100：規格先於程式；#110：邊界先於工具</text>
  <rect class="box n" x="435" y="392" width="330" height="135"/><text class="label" x="460" y="426">不適合進核心？</text><text class="txt" x="460" y="456">拒絕特定機制，保留原始需求與替代路徑</text><text class="txt" x="460" y="483">沉澱 capability boundary，標明再評估條件</text><text class="small" x="460" y="510">#110：不收第三方 UI 驅動，改評估可測邏輯封裝</text>
  <path class="dash" d="M765 258 L805 258"/><path class="red" d="M600 355 L600 392"/><text class="tag" x="615" y="376">不適合</text>
  <text class="h" x="805" y="130">3  SOP 成為唯一審閱基準</text><rect class="box r" x="805" y="150" width="330" height="205"/><text class="label" x="830" y="184">可實作合約</text><text class="txt" x="830" y="215">輸入 / identity / 座標或版本基準</text><text class="txt" x="830" y="243">candidate / review_required / blocked 狀態</text><text class="txt" x="830" y="271">preview、create、rollback、readback 邊界</text><text class="txt" x="830" y="299">缺值、部分失敗與人工核准的處理</text><text class="small" x="830" y="331">#100：discover → preview → create；#99：唯讀候選</text>
  <path class="edge" d="M970 355 L970 405"/>
  <rect class="box r" x="805" y="405" width="330" height="122"/><text class="label" x="830" y="439">交給下一位執行者</text><text class="txt" x="830" y="469">工作切分、輸入與結果、驗收表與官方資料查證</text><text class="small" x="830" y="500">版本、模型影響或復原方式未確認時停止交接</text>
  <path class="dash" d="M1135 258 C1175 258,1175 235,1215 235"/><path class="dash" d="M1135 466 C1175 466,1175 404,1215 404"/>
  <text class="h" x="1215" y="130">4  PR 與證據階梯</text><rect class="box p" x="1215" y="150" width="280" height="175"/><text class="label" x="1240" y="184">實作 PR</text><text class="txt" x="1240" y="214">跨層註冊：Agent 可見的工具</text><text class="txt" x="1240" y="241">↔ host dispatcher / handler</text><text class="txt" x="1240" y="268">build、contract test、QA/QC</text><text class="small" x="1240" y="299">PR #115/#124 均為 open；不可說已合併</text>
  <rect class="box v" x="1215" y="370" width="280" height="157"/><text class="label" x="1240" y="404">分層驗證與缺口回報</text><text class="txt" x="1240" y="434">宣告 → handler → build → runtime → domain coverage</text><text class="txt" x="1240" y="461">每一層記錄同批版本、模型與讀回</text><text class="small" x="1240" y="493">#111：修復後仍逐步補 runtime 與實際模型 dry run</text>
  <path class="teal" d="M1355 325 L1355 370"/>
  <rect x="55" y="630" width="1440" height="250" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text class="h" x="80" y="667">這對 research-partner 的可交付改變</text>
  <text class="label" x="80" y="705">每輪研究不只說「建議做什麼」；還要交出可供下一角色使用的物件。</text><text class="txt" x="80" y="740">1. 把案例整理成可做的流程：問題、既有證據、少量待確認事項、第一版邊界、維護者決策。</text><text class="txt" x="80" y="770">2. 交給下一位執行者：工作切分、輸入與結果、預覽／建立／回查約定、驗收表。</text><text class="txt" x="80" y="800">3. 能不能做，以及替代作法：停止的機制、原因、替代路徑、再評估條件。</text><text class="txt" x="80" y="830">4. 做到哪一步的證據檢查：從可找到、可連到工作、可建置、實際執行到回查，未驗項不被「通過」掩蓋。</text><text class="small" x="80" y="858">本圖說明觀察到的流程模式；不是特定 PR 已合併、部署或工程核准的證據。</text>
</svg>
